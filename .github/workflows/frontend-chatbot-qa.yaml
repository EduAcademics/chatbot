name: frontend-qa-pipeline

on:
  push:
    branches:
      - live-chatbot-qa-ui

concurrency:
  group: frontend-qa-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build-ChatbotFrontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Frontend code checkout
        uses: actions/checkout@v4

      - name: Get short commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short=8 HEAD)" >> $GITHUB_OUTPUT

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: aws credentials configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: ECR Login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build ChatbotFrontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            VITE_NAME=AI chatbot QA
            VITE_URL=https://qa-ai.schoolforschools.ai
            VITE_API_BASE_URL=https://qa-chatapi.schoolforschools.ai
            VITE_WS_BASE_URL=wss://qa-chatapi.schoolforschools.ai
            VITE_BOT_START_URL=https://qa-chatapi.schoolforschools.ai/client/start
            VITE_TURN_URL=turn:turn.schoolforschools.ai:3478
            VITE_TURN_USERNAME=webrtc
            VITE_TURN_CREDENTIAL=webrtcpass
            VITE_STUN_URL=stun:stun.l.google.com:19302
            VITE_BOT_START_PUBLIC_API_KEY=
            TRANSLATOR=false
          tags: ${{ secrets.ECR_REGISTRY_QA_CHATBOTFRONTEND }}:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=qa-chatbot-frontend
          cache-to: type=gha,mode=max,scope=qa-chatbot-frontend
          provenance: false

  Frontend-CD:
    runs-on: ubuntu-latest
    needs: [Build-ChatbotFrontend]
    timeout-minutes: 10
    steps:
      - name: Checkout k8s-repo
        uses: actions/checkout@v4
        with:
          repository: code-sfs/DevOps
          token: ${{ secrets.K8S_REPO_TOKEN }}
          path: gitops-repo

      - name: Update image tag in deployment manifest
        run: |
          cd gitops-repo/qa-chatbot/qa-chatbot-frontend
          sed -i "s|image: \".*\"|image: \"${{ secrets.ECR_REGISTRY_QA_CHATBOTFRONTEND }}:${{ needs.Build-ChatbotFrontend.outputs.image_tag }}\"|" deployment.yaml
          cat deployment.yaml | grep image

      - name: Commit and push changes
        run: |
          cd gitops-repo
          git config user.name "kanhaiya"
          git config user.email "kanhaiya.g@schoolforschools.ai"
          git add qa-chatbot/qa-chatbot-frontend/deployment.yaml
          git commit -m "chore(qa): frontend image -> commit ${{ needs.Build-ChatbotFrontend.outputs.image_tag }}" || echo "No changes to commit"
          git pull --rebase
          git push

      - name: Wait & check frontend health
        run: |
          echo "ArgoCD auto-sync + selfHeal se rollout ho jayega, thoda wait karte hain"
          sleep 60
          response=$(curl -s -o /dev/null -w "%{http_code}" https://qa-ai.schoolforschools.ai || echo "000")
          echo "Response code: $response"
          if [ "$response" = "200" ] || [ "$response" = "301" ] || [ "$response" = "302" ]; then
            echo "Frontend QA is healthy: status $response ✅"
          else
            echo "⚠️ Frontend QA not reachable yet (status $response) — DNS/ingress pending, not failing pipeline for now"
          fi

      - name: Success Deployment Notification
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ Frontend QA deployed successfully — commit ${{ needs.Build-ChatbotFrontend.outputs.image_tag }}"
          to: ${{ vars.EMAIL_TO }}
          from: ${{ secrets.EMAIL_USERNAME }}
          html_body: |
            <p>Chatbot Frontend QA image tag pushed to k8s-repo — commit ${{ needs.Build-ChatbotFrontend.outputs.image_tag }}</p>
            <p>ArgoCD will auto-sync this shortly.</p>
            <p>Endpoint: <a href="https://qa-ai.schoolforschools.ai">qa-ai.schoolforschools.ai</a></p>

      - name: Failure Deployment Notification
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ Frontend QA pipeline failed — commit ${{ needs.Build-ChatbotFrontend.outputs.image_tag }}"
          to: ${{ vars.EMAIL_TO }}
          from: ${{ secrets.EMAIL_USERNAME }}
          html_body: |
            <p>Chatbot Frontend QA deployment failed — commit ${{ needs.Build-ChatbotFrontend.outputs.image_tag }}</p>
            <p>Check logs: <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">${{ github.run_id }}</a></p>